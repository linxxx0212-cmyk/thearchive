<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linx's Archive · Enter </title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">

    <style>
        /* ============================================================
           TOKENS — "Withered Rose" gothic palette
           ============================================================ */
        :root {
            --void:        #060405;
            --void-2:      #0d0708;
            --panel:       #140b0d;
            --blood:       #4a0712;
            --crimson:     #8c1128;
            --rose:        #ff2f5e;
            --rose-soft:   #d94a6a;
            --gold:        #a3813f;
            --bone:        #f1e7e1;
            --ash:         #b9a8a6;
            --ash-dim:     #7c6d6c;
            --line:        rgba(241,231,225,0.10);
            --shadow-deep: 0 20px 60px rgba(0,0,0,0.65);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }

        body {
            margin: 0;
            color: var(--ash);
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.15rem;
            line-height: 1.7;
            overflow: hidden;
            background:
                radial-gradient(ellipse at center, rgba(6,4,5,0.3) 0%, rgba(6,4,5,0.85) 100%),
                url('605312006215402703.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        h1, h2, .brand-word {
            font-family: 'Cinzel', serif;
            color: var(--bone);
            letter-spacing: 0.03em;
        }

        ::selection { background: var(--crimson); color: var(--bone); }

        /* ============================================================
           LAYERING — fixed background veil, glass, depth
           ============================================================ */
        .bg-veil {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(90, 10, 25, 0.20) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(163, 129, 63, 0.06) 0%, transparent 50%);
            pointer-events: none;
        }

        .embers {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .ember {
            position: absolute;
            bottom: -10px;
            width: 4px;
            height: 4px;
            background: var(--rose);
            border-radius: 50%;
            box-shadow: 0 0 8px 2px rgba(255,47,94,0.7);
            opacity: 0;
            animation: rise linear infinite;
        }
        @keyframes rise {
            0%   { transform: translateY(0) translateX(0); opacity: 0; }
            10%  { opacity: 0.85; }
            90%  { opacity: 0.4; }
            100% { transform: translateY(-105vh) translateX(20px); opacity: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            .ember { animation: none; display: none; }
        }

        /* ============================================================
           INTRO CONTAINER — glassmorphism + layered corners
           ============================================================ */
        .intro-container {
            position: relative;
            z-index: 2;
            max-width: 700px;
            padding: 40px 30px;
            background: linear-gradient(160deg, rgba(20,11,13,0.88), rgba(10,6,7,0.94));
            backdrop-filter: blur(4px) saturate(1.1);
            -webkit-backdrop-filter: blur(4px) saturate(1.1);
            border: 1px solid var(--line);
            border-radius: 2px;
            box-shadow: var(--shadow-deep), inset 0 1px 0 rgba(255,47,94,0.05);
            animation: fadeIn 1.5s ease;
            transition: box-shadow 0.3s;
        }
        .intro-container:hover {
            box-shadow: 0 30px 70px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,47,94,0.15);
        }

        .intro-container::before,
        .intro-container::after {
            content: '';
            position: absolute;
            width: 34px;
            height: 34px;
            border: 1px solid var(--rose-soft);
            opacity: 0.3;
            transition: opacity 0.3s;
        }
        .intro-container:hover::before,
        .intro-container:hover::after { opacity: 0.6; }
        .intro-container::before { top: 14px; left: 14px; border-right: none; border-bottom: none; }
        .intro-container::after { bottom: 14px; right: 14px; border-left: none; border-top: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .intro-eyebrow {
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: var(--rose-soft);
            margin-bottom: 20px;
            display: block;
            text-shadow: 0 0 12px rgba(255,47,94,0.15);
        }

        .intro-title {
            font-family: 'Cinzel Decorative', serif;
            font-weight: 700;
            font-size: clamp(4rem, 15vw, 7rem);
            letter-spacing: 0.06em;
            line-height: 1;
            color: var(--bone);
            text-shadow: 0 0 50px rgba(255,47,94,0.3), 0 10px 40px rgba(0,0,0,0.8);
            margin-bottom: 20px;
        }

        .intro-sub {
            font-style: italic;
            font-size: 1.3rem;
            color: var(--ash);
            margin-bottom: 40px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .btn-enter {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            padding: 18px 60px;
            border-radius: 2px;
            border: 1px solid var(--rose);
            color: var(--bone);
            background: linear-gradient(120deg, var(--blood), var(--crimson));
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 8px 30px rgba(140,17,40,0.35), inset 0 1px 0 rgba(255,47,94,0.2);
            transition: all 0.3s ease;
        }
        .btn-enter:hover {
            color: var(--void);
            background: var(--rose);
            box-shadow: 0 12px 45px rgba(255,47,94,0.6), inset 0 1px 0 rgba(255,255,255,0.3);
            transform: translateY(-3px) scale(1.02);
        }

        .intro-footer {
            margin-top: 40px;
            color: var(--ash-dim);
            font-size: 0.85rem;
        }
        .intro-footer a {
            color: var(--ash);
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }
        .intro-footer a:hover {
            color: var(--rose);
            text-shadow: 0 0 12px rgba(255,47,94,0.2);
        }

        .thorn-divider {
            width: 100%;
            max-width: 300px;
            margin: 0 auto 30px;
            display: block;
            filter: drop-shadow(0 0 10px rgba(255,47,94,0.15));
        }

        @media (max-width: 768px) {
            .intro-container { padding: 30px 20px; }
            .intro-title { font-size: 3.5rem; }
            .btn-enter { padding: 14px 30px; font-size: 0.8rem; }
        }

        /* ============================================================
           PAGE VEIL — layered transition (archive seal)
           ============================================================ */
        .page-veil {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background:
                radial-gradient(circle at center, var(--blood) 0%, var(--void) 62%),
                var(--void);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            clip-path: circle(150% at 50% 50%);
            -webkit-clip-path: circle(150% at 50% 50%);
            transition: clip-path 0.95s cubic-bezier(0.76,0,0.24,1), -webkit-clip-path 0.95s cubic-bezier(0.76,0,0.24,1);
        }
        .page-veil.veil-open {
            clip-path: circle(0% at 50% 50%);
            -webkit-clip-path: circle(0% at 50% 50%);
        }
        .page-veil .veil-seal {
            width: 78px;
            height: 78px;
            filter: drop-shadow(0 0 22px rgba(255,47,94,0.55));
            transition: transform 0.7s ease, opacity 0.55s ease;
            transform: scale(1) rotate(0deg);
            opacity: 1;
        }
        .page-veil.veil-open .veil-seal {
            transform: scale(0.35) rotate(50deg);
            opacity: 0;
        }
        @media (prefers-reduced-motion: reduce) {
            .page-veil { transition: none !important; }
            .page-veil .veil-seal { transition: none !important; }
        }
    </style>
</head>
<body>

    <!-- fixed background veil (deep layer) -->
    <div class="bg-veil" aria-hidden="true"></div>

    <!-- ambient embers (layer 1) -->
    <div class="embers" id="embers"></div>

    <!-- page veil transition -->
    <div class="page-veil" id="pageVeil" aria-hidden="true">
        <svg class="veil-seal" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="veilGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ff2f5e"/>
                    <stop offset="100%" stop-color="#4a0712"/>
                </linearGradient>
            </defs>
            <path d="M32 8c6 4 9 9 9 14 0 6-4 10-9 12-5-2-9-6-9-12 0-5 3-10 9-14z" fill="url(#veilGrad)"/>
            <path d="M32 20c3 2 5 5 5 8 0 4-2.5 6.5-5 7.5-2.5-1-5-3.5-5-7.5 0-3 2-6 5-8z" fill="#0d0708" opacity="0.5"/>
            <path d="M32 34v22" stroke="#3c4a2e" stroke-width="2"/>
            <path d="M32 40l-7 5M32 46l7 5" stroke="#3c4a2e" stroke-width="2" fill="none"/>
        </svg>
    </div>

    <!-- Intro Container (layer 2) -->
    <div class="intro-container">
        <span class="intro-eyebrow"></span>

        <svg class="thorn-divider" viewBox="0 0 300 30" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 15 C 80 5, 150 25, 210 15 S 290 5, 300 15" fill="none" stroke="#5c1a24" stroke-width="1.5"/>
            <path d="M60 15 l-4 -6 M100 17 l4 7 M150 13 l-4 -7 M240 17 l4 7 M270 13 l-4 -6" stroke="#5c1a24" stroke-width="1.5"/>
            <circle cx="150" cy="15" r="5" fill="#ff2f5e" opacity="0.6"/>
        </svg>

        <h1 class="intro-title">The archive</h1>
        <p class="intro-sub">The archive awaits. Enter if you are ready to read what has not yet been written.</p>

        <a href="home.html" class="btn-enter"><i class="bi bi-door-open me-2"></i> Enter the Archive</a>

    <script>
        // Ambient embers
        (function() {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            var field = document.getElementById('embers');
            var count = window.innerWidth < 700 ? 8 : 14;
            for (var i = 0; i < count; i++) {
                var e = document.createElement('div');
                e.className = 'ember';
                e.style.left = Math.random() * 100 + 'vw';
                e.style.animationDuration = (9 + Math.random() * 10) + 's';
                e.style.animationDelay = (Math.random() * 12) + 's';
                e.style.opacity = 0;
                field.appendChild(e);
            }
        })();

        // --- Page Veil Transition ---
        (function() {
            var veil = document.getElementById('pageVeil');
            if (!veil) return;

            function openVeil() {
                setTimeout(function() { veil.classList.add('veil-open'); }, 150);
            }
            if (document.readyState === 'complete') { openVeil(); }
            else { window.addEventListener('load', openVeil); }

            document.querySelectorAll('a[href]').forEach(function(link) {
                var href = link.getAttribute('href');
                if (!href || href === '#' || href.charAt(0) === '#') return;
                if (href.indexOf('http') === 0 || href.indexOf('mailto:') === 0 || href.indexOf('tel:') === 0) return;
                if (link.target === '_blank') return;

                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    veil.classList.remove('veil-open');
                    setTimeout(function() { window.location.href = href; }, 720);
                });
            });
        })();
    </script>

</body>
